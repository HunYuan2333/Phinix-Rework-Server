name: Build and publish server image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push:
    name: Build and push image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to Docker Hub
      if: vars.SERVER_IMAGE_PUBLISH_ENABLED == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Extract tags
      id: tags
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: hunyuan2333/phinix-rework
        flavor: latest=false
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          type=ref,event=branch,enable=${{ github.ref == 'refs/heads/dev' }}
          type=semver,pattern={{version}}
          type=sha,format=long

    - name: Publish to Docker Hub
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64
        push: ${{ vars.SERVER_IMAGE_PUBLISH_ENABLED == 'true' }}
        load: ${{ vars.SERVER_IMAGE_PUBLISH_ENABLED != 'true' }}
        tags: ${{ steps.tags.outputs.tags }}
        labels: ${{ steps.tags.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
